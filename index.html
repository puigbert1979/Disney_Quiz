<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qui és qui? El joc dels personatges Disney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1b1850;
    --night-2:#28257a;
    --night-3:#2d2a85;
    --gold:#ffc83d;
    --gold-deep:#c98f00;
    --paper:#fff7e6;
    --ink:#251a4a;
    --ink-soft:#5b4f86;
    --edge:#9a92e6;
    --line:#e4e0fb;
    --princess-bg:#ffd9e6;
    --princess-edge:#e03a4e;
    --good:#2fbf71;
    --bad:#e03a4e;
    --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    --body:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; background:var(--night); color:#fff;
    font-family:var(--body); font-weight:600; line-height:1.4;
  }
  button,input{font-family:inherit}
  :focus-visible{outline:3px solid var(--gold); outline-offset:3px}
  .sheet :focus-visible, .dialog :focus-visible{outline-color:var(--ink)}

  /* ---------- Fons: cel de nit i castell ---------- */
  .sky{position:fixed; inset:0; z-index:0; pointer-events:none}
  .sky i{position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:.55}
  .castle{position:fixed; left:0; right:0; bottom:0; width:100%; height:auto; z-index:0; pointer-events:none; display:block}

  .app{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:16px 20px 110px}

  /* ---------- Barra superior i idioma ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px}
  .brand{font:400 26px var(--display); color:var(--gold); display:flex; gap:8px; align-items:center}
  body[data-screen="players"] .brand{visibility:hidden}
  .lang{display:inline-flex; background:rgba(255,255,255,.13); border-radius:999px; padding:4px}
  .lang button{
    border:0; background:transparent; color:#fff; font-weight:900; font-size:14px;
    padding:8px 16px; min-width:52px; border-radius:999px; cursor:pointer; letter-spacing:.04em;
  }
  .lang button[aria-pressed="true"]{background:var(--gold); color:var(--ink)}

  /* ---------- Títol i passos (només a la configuració) ---------- */
  .hero{display:none; text-align:center; margin:4px 0 22px}
  body[data-screen="players"] .hero{display:block}
  .hero h1{
    font:400 clamp(48px,11vw,92px)/1 var(--display); margin:0; color:var(--gold);
    -webkit-text-stroke:7px #12103a; paint-order:stroke fill; text-shadow:0 7px 0 #12103a; letter-spacing:.01em;
  }
  .hero p{margin:16px 0 0; font-weight:800; font-size:clamp(16px,2.6vw,21px); color:#dcd8ff}

  .stepper{display:none; justify-content:center; gap:8px; flex-wrap:wrap; list-style:none; padding:0; margin:0 0 20px}
  body[data-screen="players"] .stepper, body[data-screen="movies"] .stepper{display:flex}
  .stepper li{
    display:flex; align-items:center; gap:8px; padding:5px 14px 5px 5px; border-radius:999px;
    background:rgba(255,255,255,.1); color:#cfcaf7; font-weight:800; font-size:14px;
  }
  .stepper .n{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; font-size:13px}
  .stepper li.current{background:var(--gold); color:var(--ink)}
  .stepper li.current .n{background:var(--ink); color:var(--gold)}
  .stepper li.done .n{background:var(--good); color:#fff}

  .screen{display:none}
  .screen.active{display:block}

  /* ---------- Fulls de configuració ---------- */
  .sheet{
    background:var(--paper); color:var(--ink); border-radius:28px; padding:28px;
    max-width:640px; margin:0 auto; box-shadow:0 8px 0 #0e0c33;
  }
  .sheet h2{font:400 clamp(26px,4vw,34px)/1.1 var(--display); margin:0 0 6px}
  .sheet .help{margin:0; color:var(--ink-soft); font-weight:700}

  .count{display:flex; gap:10px; margin:20px 0}
  .count button{
    flex:1; max-width:76px; aspect-ratio:1; border-radius:20px; border:3px solid var(--edge);
    background:#fff; color:var(--ink); font:400 32px var(--display); cursor:pointer;
  }
  .count button[aria-pressed="true"]{background:var(--gold); border-color:var(--ink)}

  .names{display:grid; gap:10px; grid-template-columns:1fr}
  @media (min-width:560px){ .names{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .name-row{
    display:flex; align-items:center; gap:10px; background:#fff; border:3px solid var(--line);
    border-radius:18px; padding:6px 12px 6px 6px; min-width:0;
  }
  .name-row:focus-within{outline:3px solid var(--ink); outline-offset:2px; border-color:var(--ink)}
  .name-row input{
    flex:1; min-width:0; border:0; background:transparent; font-weight:800; font-size:17px; color:var(--ink); padding:8px 0;
  }
  .name-row input:focus-visible{outline:none}
  .name-row input::placeholder{color:#9a93bd; font-weight:700}

  .token{
    --c:var(--gold); width:42px; height:42px; border-radius:50%; background:var(--c); flex:none;
    display:grid; place-items:center; font-size:22px; border:3px solid rgba(0,0,0,.16);
  }
  .token.big{width:64px; height:64px; font-size:34px}

  .movie-row{
    display:flex; align-items:center; gap:12px; background:#fff; border:3px solid var(--line);
    border-radius:18px; padding:8px 12px 8px 8px; margin-bottom:10px;
  }
  .movie-row .who{flex:1; min-width:0; font-weight:900; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .qty{display:flex; align-items:center; gap:6px}
  .qbtn{
    width:44px; height:44px; border-radius:50%; border:3px solid var(--edge); background:#fff; color:var(--ink);
    font:400 26px/1 var(--display); cursor:pointer; padding:0;
  }
  .qty input{
    width:68px; height:44px; text-align:center; border:3px solid var(--line); border-radius:14px;
    font-weight:900; font-size:20px; color:var(--ink); background:#fff; -moz-appearance:textfield;
  }
  .qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}

  .actions{display:flex; gap:12px; margin-top:24px}
  .btn{
    font:400 22px var(--display); border:0; border-radius:999px; padding:14px 28px; cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  .btn.grow{flex:1}
  .btn-primary{background:var(--gold); color:var(--ink); box-shadow:0 6px 0 var(--gold-deep)}
  .btn-primary:active{transform:translateY(4px); box-shadow:0 2px 0 var(--gold-deep)}
  .btn-ghost{background:transparent; color:var(--ink); border:3px solid var(--ink); padding:11px 22px}
  .btn-outline{
    background:transparent; color:#fff; border:3px solid rgba(255,255,255,.85);
    font:800 16px var(--body); padding:12px 18px; border-radius:999px; cursor:pointer; width:100%;
  }
  .btn:disabled, .btn-outline:disabled{opacity:.5; cursor:not-allowed}

  /* ---------- Joc: capçalera ---------- */
  .game-head{display:flex; justify-content:space-between; align-items:center; gap:16px 24px; flex-wrap:wrap; margin:8px 0 24px}
  .turn{display:flex; align-items:center; gap:14px}
  .turn h2{font:400 clamp(28px,4vw,40px)/1.05 var(--display); margin:0}
  .rounds{display:flex; align-items:center; gap:6px; margin-top:8px; font-weight:800; font-size:14px; color:#cfcaf7}
  .star{
    width:20px; height:20px; background:rgba(255,255,255,.22);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  }
  .star.done{background:var(--gold)}
  .star.now{background:#fff; transform:scale(1.25)}
  .rounds .label{margin-left:8px}

  .scores{display:flex; flex-wrap:wrap; gap:8px; list-style:none; margin:0; padding:0; justify-content:flex-end}
  .score{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.11); border-radius:999px; padding:5px 14px 5px 5px; font-weight:800}
  .score .token{width:34px; height:34px; font-size:18px}
  .score .nm{max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .score .pts{background:var(--gold); color:var(--ink); border-radius:999px; padding:2px 10px; font-size:14px; font-weight:900}
  .score.now{background:#fff; color:var(--ink); box-shadow:0 0 0 3px var(--gold)}

  /* ---------- Joc: cartes i tauler ---------- */
  .game-grid{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:28px; align-items:start}
  .cards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px}

  .card{
    position:relative; display:block; width:100%; text-align:center; font:inherit; color:var(--ink);
    background:var(--paper); border:4px solid var(--edge); border-radius:22px; padding:14px 14px 16px;
    cursor:pointer; box-shadow:0 7px 0 rgba(0,0,0,.28); transition:transform .15s;
  }
  .card:nth-child(1){transform:rotate(-1.4deg)}
  .card:nth-child(2){transform:rotate(1deg)}
  .card:nth-child(3){transform:rotate(.8deg)}
  .card:nth-child(4){transform:rotate(-1.1deg)}
  .card:hover:not(:disabled){transform:rotate(0) translateY(-3px)}
  .card.princess{background:var(--princess-bg); border-color:var(--princess-edge)}
  .card.selected, .card.princess.selected{background:#e9fbf0; border-color:var(--good); transform:rotate(0) scale(1.02)}
  .card:disabled{cursor:not-allowed; filter:brightness(.55) saturate(.6)}
  .card .tag{
    display:inline-block; border-radius:999px; padding:3px 12px; font-weight:900; font-size:13px; margin-bottom:10px;
  }
  .tag.lvl-0{background:#ffd5d5; color:#8f1d1d}
  .tag.lvl-1{background:#ffeaa3; color:#6b5300}
  .tag.lvl-2{background:#c8f0d6; color:#17653a}
  .card .face{
    display:grid; place-items:center; width:84px; height:84px; margin:0 auto 10px; border-radius:50%;
    background:#fff; border:3px solid var(--line); font-size:46px; line-height:1;
  }
  .card.princess .face{border-color:#ffb3c9}
  .card .clue{display:block; font-weight:700; font-size:15px; line-height:1.4; min-height:84px; text-wrap:pretty}

  /* ---------- Joc: tauler de resposta ---------- */
  .panel{
    position:sticky; top:16px; background:var(--night-3); border:4px solid var(--gold);
    border-radius:26px; padding:22px; box-shadow:0 8px 0 rgba(0,0,0,.3);
  }
  .panel :focus-visible{outline-color:#fff}
  .panel h3{font:400 26px/1.1 var(--display); margin:0 0 8px; color:var(--gold)}
  .panel p{margin:0 0 14px; color:#e7e4ff; font-weight:700}
  .rules-title{font:800 15px var(--body); margin:18px 0 6px; color:#fff}
  .rules{margin:0}
  .rules div{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.16); font-weight:700; font-size:15px}
  .rules div:last-child{border-bottom:0}
  .rules dt{color:#e7e4ff}
  .rules dd{margin:0; font-weight:900; color:var(--gold); white-space:nowrap}

  .levelbar{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-weight:900; font-size:15px}
  .pip{width:16px; height:16px; border-radius:50%; border:3px solid rgba(255,255,255,.5); background:transparent}
  .pip.on.lvl-0{background:#ff7b7b; border-color:#ff7b7b}
  .pip.on.lvl-1{background:var(--gold); border-color:var(--gold)}
  .pip.on.lvl-2{background:#5fd89a; border-color:#5fd89a}
  .levelbar .lbl{margin-left:4px}
  .panel-clue{font:800 clamp(19px,2.2vw,22px)/1.4 var(--body); color:#fff; margin:0 0 14px; min-height:92px}
  .stakes{background:rgba(255,255,255,.1); border-radius:14px; padding:10px 12px; font-weight:700; font-size:15px; margin:0 0 14px}
  .stakes strong{color:var(--gold); font-weight:900}
  .panel input[type="text"]{
    width:100%; padding:14px; border-radius:14px; border:3px solid transparent; background:#fff; color:var(--ink);
    font-weight:800; font-size:18px; margin-bottom:12px;
  }
  .panel input::placeholder{color:#9a93bd; font-weight:700}
  .panel .btn-primary{width:100%; font-size:22px}
  .panel .btn-outline{margin-top:12px}
  .locknote{margin:14px 0 0 !important; font-size:13px; color:#cfcaf7 !important}

  @media (max-width:900px){
    .game-grid{grid-template-columns:1fr}
    .panel{position:static}
    .scores{justify-content:flex-start}
  }
  @media (max-width:520px){
    .app{padding:12px 14px 90px}
    .sheet{padding:22px 18px}
    .cards{gap:14px}
    .card{padding:10px 10px 12px; border-width:3px}
    .card .face{width:62px; height:62px; font-size:34px}
    .card .clue{font-size:13.5px; min-height:0}
    .stepper li{font-size:13px; padding-right:10px}
  }

  /* ---------- Resposta (correcte / fallada) ---------- */
  .overlay{position:fixed; inset:0; display:none; place-items:center; background:rgba(10,8,40,.72); z-index:50; padding:16px}
  .overlay.show{display:grid}
  .dialog{
    background:var(--paper); color:var(--ink); border:6px solid var(--good); border-radius:30px;
    padding:28px 26px; max-width:380px; width:100%; text-align:center; box-shadow:0 10px 0 rgba(0,0,0,.35);
    animation:dialogIn .4s cubic-bezier(.2,1.5,.4,1);
  }
  .dialog.wrong{border-color:var(--bad)}
  .dialog .face-xl{
    width:124px; height:124px; border-radius:50%; background:#fff; border:4px solid var(--line);
    display:grid; place-items:center; font-size:70px; line-height:1; margin:0 auto 14px;
  }
  .dialog.correct .face-xl{animation:hop .55s ease-in-out 2}
  .dialog.wrong .face-xl{animation:shake .5s}
  .dialog h3{font:400 34px/1.1 var(--display); margin:0 0 8px}
  .dialog.correct h3{color:#17653a}
  .dialog.wrong h3{color:#a82233}
  .dialog p{margin:0 0 20px; font-weight:700; font-size:17px}
  @keyframes dialogIn{0%{transform:scale(.6) rotate(-4deg); opacity:0} 100%{transform:scale(1) rotate(0); opacity:1}}
  @keyframes hop{0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)}}
  @keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px)} 40%{transform:translateX(12px)} 60%{transform:translateX(-7px)} 80%{transform:translateX(7px)}}

  .confetti-piece{position:fixed; top:-30px; z-index:60; pointer-events:none; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

  /* ---------- Final: podi ---------- */
  .final{text-align:center; max-width:680px}
  .final .crown{font-size:72px; line-height:1; display:inline-block; animation:crownIn .7s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes crownIn{0%{transform:translateY(-60px) rotate(-12deg); opacity:0} 100%{transform:none; opacity:1}}
  .final .kicker{margin:4px 0 4px; color:var(--ink-soft); font-weight:800; font-size:17px}
  .final h2{font:400 clamp(32px,6vw,50px)/1.05 var(--display); margin:0 0 26px; color:var(--ink)}
  .podium{display:flex; justify-content:center; align-items:flex-end; gap:10px; margin:0 auto 18px; max-width:520px}
  .pod{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center}
  .pod .nm{font-weight:900; font-size:17px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:8px}
  .pod .pt{font-weight:800; color:var(--ink-soft); font-size:15px; margin-bottom:8px}
  .pod .block{
    width:100%; border-radius:16px 16px 0 0; display:grid; place-items:start center; padding-top:10px;
    font:400 40px/1 var(--display); color:var(--ink);
  }
  .pod.r1 .block{height:150px; background:var(--gold)}
  .pod.r2 .block{height:110px; background:#d7d9ea}
  .pod.r3 .block{height:80px; background:#e6a972}
  .rest{list-style:none; margin:0 auto 4px; padding:0; max-width:420px; text-align:left}
  .rest li{display:flex; align-items:center; gap:10px; background:#fff; border:3px solid var(--line); border-radius:16px; padding:6px 14px 6px 6px; margin-bottom:8px; font-weight:800}
  .rest .rk{font:400 22px var(--display); width:26px; text-align:center}
  .rest .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rest .token{width:34px; height:34px; font-size:18px}

  .foot{text-align:center; margin-top:34px; color:#cfcaf7; font-size:13px; font-weight:700}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation:none !important; transition:none !important}
  }
</style>
</head>
<body data-screen="players">

<div class="sky" id="sky" aria-hidden="true"></div>
<svg class="castle" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <path fill="#28257a" d="M0 200 V160 H90 V130 L110 100 L130 130 V160 H220 V120 H240 V70 L270 20 L300 70 V120 H320 V160 H430 V140 H470 V160 H560 V110 H580 V60 L610 10 L640 60 V110 H660 V160 H770 V130 H790 V100 L810 70 L830 100 V130 H850 V160 H960 V120 H980 V80 L1005 35 L1030 80 V120 H1050 V160 H1200 V200 Z"/>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand"><span aria-hidden="true">🏰</span><span data-i18n="title"></span></div>
    <div class="lang" role="group" data-i18n-aria="langGroup">
      <button type="button" data-lang="ca" aria-label="Català" title="Català" aria-pressed="true">CA</button>
      <button type="button" data-lang="en" aria-label="English" title="English" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="hero">
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </div>

  <ol class="stepper" id="stepper">
    <li data-step="0"><span class="n">1</span><span data-i18n="stepPlayers"></span></li>
    <li data-step="1"><span class="n">2</span><span data-i18n="stepMovies"></span></li>
    <li data-step="2"><span class="n">3</span><span data-i18n="stepPlay"></span></li>
  </ol>

  <main>
    <!-- Pas 1: jugadors -->
    <section class="screen active" id="screen-players">
      <div class="sheet">
        <h2 id="playersTitle" data-i18n="playersTitle"></h2>
        <p class="help" data-i18n="playersHelp"></p>
        <div class="count" id="countButtons" role="group" aria-labelledby="playersTitle"></div>
        <div class="names" id="nameFields"></div>
        <div class="actions">
          <button type="button" class="btn btn-primary grow" id="btnGoMovies" data-i18n="next"></button>
        </div>
      </div>
    </section>

    <!-- Pas 2: pel·lícules -->
    <section class="screen" id="screen-movies">
      <div class="sheet">
        <h2 data-i18n="moviesTitle"></h2>
        <p class="help" data-i18n="moviesHelp"></p>
        <div id="movieFields" style="margin-top:20px"></div>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="btnBackPlayers" data-i18n="back"></button>
          <button type="button" class="btn btn-primary grow" id="btnStartGame" data-i18n="start"></button>
        </div>
      </div>
    </section>

    <!-- Pas 3: joc -->
    <section class="screen" id="screen-game">
      <div class="game-head">
        <div class="turn">
          <span class="token big" id="turnToken"></span>
          <div>
            <h2 id="turnHeading"></h2>
            <div class="rounds" id="rounds"></div>
          </div>
        </div>
        <ul class="scores" id="scoreboard"></ul>
      </div>

      <div class="game-grid">
        <div class="cards" id="cardsGrid"></div>

        <aside class="panel" id="panel">
          <div id="panelEmpty">
            <h3 data-i18n="panelEmptyTitle"></h3>
            <p data-i18n="panelEmptyText"></p>
            <h4 class="rules-title" data-i18n="scoringTitle"></h4>
            <dl class="rules" id="rules"></dl>
          </div>

          <div id="panelActive" hidden>
            <div class="levelbar">
              <span class="pip lvl-0" data-pip="0"></span>
              <span class="pip lvl-1" data-pip="1"></span>
              <span class="pip lvl-2" data-pip="2"></span>
              <span class="lbl" id="levelLabel"></span>
            </div>
            <p class="panel-clue" id="currentClueBox" aria-live="polite"></p>
            <p class="stakes" id="pointsHint"></p>
            <label class="sr-only" for="guessInput" style="position:absolute;left:-9999px" data-i18n="guessLabel"></label>
            <input type="text" id="guessInput" autocomplete="off" autocapitalize="words" data-i18n-ph="guessPlaceholder">
            <button type="button" class="btn btn-primary" id="btnSubmitGuess" data-i18n="check"></button>
            <button type="button" class="btn-outline" id="btnNextClue"></button>
            <p class="locknote" data-i18n="locked"></p>
          </div>
        </aside>
      </div>
    </section>

    <!-- Final -->
    <section class="screen" id="screen-final">
      <div class="sheet final">
        <div class="crown" aria-hidden="true">👑</div>
        <p class="kicker" id="finalKicker"></p>
        <h2 id="winnerName"></h2>
        <div class="podium" id="podium"></div>
        <ul class="rest" id="finalRest"></ul>
        <div class="actions">
          <button type="button" class="btn btn-primary grow" id="btnRestart" data-i18n="playAgain"></button>
        </div>
      </div>

let LANG = 'ca';
try{
  const stored = localStorage.getItem('disneyQuizLang');
  if(stored==='ca' || stored==='en') LANG = stored;
  else if((navigator.language||'').toLowerCase().startsWith('en')) LANG = 'en';
}catch(e){}

function t(key, vars){
  let s = (STRINGS[LANG] && STRINGS[LANG][key]);
  if(s === undefined) s = STRINGS.ca[key];
  if(s === undefined) s = key;
  if(vars){ for(const k in vars){ s = s.split('{'+k+'}').join(vars[k]); } }
  return s;
}
function ptsText(n){ return n + ' ' + (n===1 ? t('point') : t('points')); }
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ch = c => c[LANG];
const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function normalize(str){
  return str.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’‘]/g,"'").replace(/['\-]/g,"").replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ============ IDIOMA ============ */
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang===LANG)));
  renderRules();
}
function setLang(l){
  if(l===LANG) return;
  LANG = l;
  try{ localStorage.setItem('disneyQuizLang', l); }catch(e){}
  applyStatic();
  if(currentScreen==='screen-players') renderPlayerSetup();
  else if(currentScreen==='screen-movies') renderMovies();
  else if(currentScreen==='screen-game') renderGame();
  else if(currentScreen==='screen-final') renderFinal();
  if(state.feedback && overlay.classList.contains('show')) renderFeedback();
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

function renderRules(){
  const rules = $('rules'); rules.innerHTML = '';
  [['scoreHard',ptsText(3)],['scoreMedium',ptsText(2)],['scoreEasy',ptsText(1)],['scorePrincess','+'+ptsText(1)]].forEach(([k,v])=>{
    const row = document.createElement('div');
    row.innerHTML = `<dt>${esc(t(k))}</dt><dd>${esc(v)}</dd>`;
    rules.appendChild(row);
  });
}

/* ============ PANTALLES ============ */
function showScreen(id){
  currentScreen = id;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id===id));
  document.body.dataset.screen = id.replace('screen-','');
  const cur = id==='screen-players' ? 0 : id==='screen-movies' ? 1 : 2;
  document.querySelectorAll('#stepper li').forEach(li => {
    const i = Number(li.dataset.step);
    li.classList.toggle('current', i===cur);
    li.classList.toggle('done', i<cur);
    if(i===cur) li.setAttribute('aria-current','step'); else li.removeAttribute('aria-current');
  });
  window.scrollTo({top:0, behavior:'auto'});
}

function makeSky(){
  const sky = $('sky');
  for(let i=0;i<46;i++){
    const s = document.createElement('i');
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*80)+'%';
    const size = 2 + Math.round(Math.random()*2);
    s.style.width = s.style.height = size+'px';
    s.style.opacity = (0.3 + Math.random()*0.5).toFixed(2);
    sky.appendChild(s);
  }
}

/* ---- Pas 1: jugadors ---- */
function buildCountButtons(){
  countButtons.innerHTML = '';
  for(let n=MIN_PLAYERS;n<=MAX_PLAYERS;n++){
    const b = document.createElement('button');
    b.type='button'; b.textContent=n; b.dataset.n=n;
    b.addEventListener('click', () => { state.numPlayers = n; renderPlayerSetup(); });
    countButtons.appendChild(b);
  }
}
function renderPlayerSetup(){
  countButtons.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.n)===state.numPlayers)));
  nameFields.innerHTML = '';
  for(let i=0;i<state.numPlayers;i++){
    const row = document.createElement('label'); row.className = 'name-row';
    const tok = document.createElement('span'); tok.className='token'; tok.style.setProperty('--c',COLORS[i]); tok.textContent=AVATARS[i]; tok.setAttribute('aria-hidden','true');
    const input = document.createElement('input');
    input.type='text'; input.maxLength=14; input.value=state.names[i];
    input.placeholder = t('playerPlaceholder',{n:i+1});
    input.setAttribute('aria-label', t('playerPlaceholder',{n:i+1}));
    input.addEventListener('input', () => { state.names[i] = input.value; });
    row.append(tok, input); nameFields.appendChild(row);
  }
}
$('btnGoMovies').addEventListener('click', () => {
  state.players = Array.from({length:state.numPlayers}, (_,i) => ({name:(state.names[i]||'').trim(), points:0}));
  renderMovies();
  showScreen('screen-movies');
});

function renderMovies(){
  movieFields.innerHTML = '';
  state.players.forEach((p,i) => {
    const name = getName(i);
    const row = document.createElement('div'); row.className='movie-row';
    row.innerHTML = `<span class="token" style="--c:${COLORS[i]}" aria-hidden="true">${AVATARS[i]}</span><span class="who"></span>
      <div class="qty"><button type="button" class="qbtn"></button><input type="number" inputmode="numeric" min="0" max="999"><button type="button" class="qbtn"></button></div>`;
    row.querySelector('.who').textContent = name;
    const input = row.querySelector('input'); input.value = state.movieCounts[i]; input.setAttribute('aria-label', t('moviesFor',{name}));
    const [minus, plus] = row.querySelectorAll('.qbtn');
    minus.textContent='−'; plus.textContent='+';
    minus.setAttribute('aria-label', t('minus')); plus.setAttribute('aria-label', t('plus'));
    const set = v => { v = Math.max(0, Math.min(999, Math.floor(v)||0)); state.movieCounts[i]=v; input.value=v; };
    minus.addEventListener('click', () => set(state.movieCounts[i]-1));
    plus.addEventListener('click', () => set(state.movieCounts[i]+1));
    input.addEventListener('input', () => { state.movieCounts[i] = Math.max(0, Math.min(999, parseInt(input.value)||0)); });
    input.addEventListener('blur', () => set(parseInt(input.value)||0));
    movieFields.appendChild(row);
  });
}
$('btnBackPlayers').addEventListener('click', () => { renderPlayerSetup(); showScreen('screen-players'); });

$('btnStartGame').addEventListener('click', () => {
  const counts = state.players.map((_,i) => state.movieCounts[i]);
  const min = Math.min(...counts);
  const candidates = counts.map((c,i)=>i).filter(i => counts[i]===min);
  const starter = candidates[Math.floor(Math.random()*candidates.length)];
  state.order = state.players.map((_,i) => (starter+i) % state.players.length);
  state.currentRound = 1; state.turnIndex = 0; state.usedCharacters = new Set();
  showScreen('screen-game');
  startTurn();
});

/* ---- Pas 3: joc ---- */
function pickRoundCharacters(){
  const free = c => !state.usedCharacters.has(c.ca.name);
  const princesses = CHARACTERS.filter(c => c.princess && free(c));
  const others = CHARACTERS.filter(c => !c.princess && free(c));
  let options = [];
  if(princesses.length) options.push(shuffle(princesses)[0]);
  options = options.concat(shuffle(others).slice(0, 4-options.length));
  if(options.length<4){
    const rest = shuffle(CHARACTERS.filter(c => !options.includes(c) && free(c)));
    while(options.length<4 && rest.length) options.push(rest.pop());
  }
  return shuffle(options);
}

function startTurn(){
  if(state.currentRound > state.totalRounds){ endGame(); return; }
  state.currentOptions = pickRoundCharacters();
  state.selectedOption = null;
  state.clueLevel = 0;
  guessInput.value = '';
  renderGame();
  window.scrollTo({top:0, behavior:'auto'});
}

function renderGame(){
  const active = state.order[state.turnIndex];
  turnToken.style.setProperty('--c', COLORS[active]); turnToken.textContent = AVATARS[active];
  turnHeading.textContent = t('turnOf',{name:getName(active)});
  renderRounds(); renderScoreboard(); renderCards(); renderPanel();
}
function renderRounds(){
  roundsEl.innerHTML = '';
  for(let i=1;i<=state.totalRounds;i++){
    const s = document.createElement('span');
    s.className = 'star' + (i<state.currentRound ? ' done' : i===state.currentRound ? ' now' : '');
    roundsEl.appendChild(s);
  }
  const label = document.createElement('span'); label.className='label';
  label.textContent = t('round',{n:state.currentRound,total:state.totalRounds});
  roundsEl.appendChild(label);
}
function renderScoreboard(){
  scoreboard.innerHTML = '';
  const active = state.order[state.turnIndex];
  state.players.forEach((p,i) => {
    const li = document.createElement('li'); li.className = 'score' + (i===active ? ' now' : '');
    if(i===active) li.setAttribute('aria-current','true');
    li.innerHTML = `<span class="token" style="--c:${COLORS[i]}" aria-hidden="true">${AVATARS[i]}</span><span class="nm">${esc(getName(i))}</span><span class="pts">${esc(t('pts',{n:p.points}))}</span>`;
    scoreboard.appendChild(li);
  });
}
function renderCards(){
  cardsGrid.innerHTML = '';
  state.currentOptions.forEach((c, idx) => {
    const isSel = state.selectedOption === idx;
    const level = isSel ? state.clueLevel : 0;
    const btn = document.createElement('button'); btn.type='button';
    btn.className = 'card' + (c.princess ? ' princess' : '') + (isSel ? ' selected' : '');
    btn.disabled = state.selectedOption !== null && !isSel;
    if(isSel) btn.setAttribute('aria-pressed','true');
    btn.innerHTML = `<span class="tag lvl-${level}">${esc(t(CLUE_KEYS[level]))}</span>
      <span class="face" aria-hidden="true">${c.emoji}</span>
      <span class="clue">${esc(ch(c).clues[level])}</span>`;
    btn.addEventListener('click', () => selectCard(idx));
    cardsGrid.appendChild(btn);
  });
}
function renderPanel(){
  const has = state.selectedOption !== null;
  panelEmpty.hidden = has; panelActive.hidden = !has;
  if(!has) return;
  const c = state.currentOptions[state.selectedOption];
  const lvl = state.clueLevel;
  currentClueBox.textContent = ch(c).clues[lvl];
  levelLabel.textContent = t(CLUE_KEYS[lvl]);
  panelActive.querySelectorAll('.pip').forEach(p => p.classList.toggle('on', Number(p.dataset.pip) <= lvl));
  const base = CLUE_POINTS[lvl], total = base + (c.princess ? 1 : 0);
  pointsHint.innerHTML = c.princess
    ? `${esc(t('ifRight'))} <strong>${base} + 1 ${esc(t('princessBonus'))} = ${esc(ptsText(total))}</strong>`
    : `${esc(t('ifRight'))} <strong>${esc(ptsText(total))}</strong>`;
  btnNextClue.disabled = lvl >= 2;
  btnNextClue.textContent = lvl >= 2 ? t('lastClue') : t('nextClue');
}

function selectCard(idx){
  if(state.selectedOption !== null) return;
  state.selectedOption = idx;
  renderCards(); renderPanel();
  if(window.matchMedia('(max-width: 900px)').matches){
    panel.scrollIntoView({behavior: reducedMotion() ? 'auto' : 'smooth', block:'start'});
  }
  guessInput.focus({preventScroll:true});
}
function nextClue(){
  if(state.selectedOption===null || state.clueLevel>=2) return;
  state.clueLevel++;
  renderCards(); renderPanel();
}
function submitGuess(){
  if(state.selectedOption===null) return;
  const guess = normalize(guessInput.value);
  if(!guess){ guessInput.focus(); return; }
  const c = state.currentOptions[state.selectedOption];
  const ok = c.accepted.some(a => normalize(a)===guess);
  if(ok){
    const pts = CLUE_POINTS[state.clueLevel] + (c.princess ? 1 : 0);
    state.players[state.order[state.turnIndex]].points += pts;
    state.usedCharacters.add(c.ca.name);
    state.feedback = {correct:true, character:c, pts};
  } else {
    state.feedback = {correct:false, character:c, pts:0};
  }
  renderFeedback();
  overlay.classList.add('show');
  if(state.feedback.correct) launchConfetti();
  btnContinue.focus();
}
$('btnSubmitGuess').addEventListener('click', submitGuess);
btnNextClue.addEventListener('click', nextClue);
guessInput.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); submitGuess(); } });

function renderFeedback(){
  const f = state.feedback; if(!f) return;
  const name = ch(f.character).name;
  dialog.className = 'dialog ' + (f.correct ? 'correct' : 'wrong');
  fbFace.textContent = f.character.emoji;
  if(f.correct){
    fbTitle.textContent = t('correctTitle');
    fbText.textContent = t('correctText',{name, pts:ptsText(f.pts)}) + (f.character.princess ? t('correctPrincess') : '');
  } else {
    fbTitle.textContent = t('wrongTitle');
    fbText.textContent = t('wrongText',{name});
  }
}
btnContinue.addEventListener('click', () => {
  overlay.classList.remove('show');
  state.feedback = null;
  state.turnIndex++;
  if(state.turnIndex >= state.order.length){ state.turnIndex = 0; state.currentRound++; }
  startTurn();
});

function launchConfetti(){
  if(reducedMotion()) return;
  const emojis = ["🎉","✨","🎊","⭐","💖","🌟"];
  for(let i=0;i<28;i++){
    const p = document.createElement('div'); p.className='confetti-piece';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = Math.random()*100+'vw';
    p.style.fontSize = (16+Math.random()*16)+'px';
    p.style.animationDuration = (1.6+Math.random()*1.4)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 3300);
  }
}

/* ---- Final ---- */
function endGame(){
  showScreen('screen-final');
  renderFinal();
  launchConfetti();
}
function renderFinal(){
  const ranked = state.players.map((p,i)=>({i, name:getName(i), points:p.points})).sort((a,b)=>b.points-a.points);
  const best = ranked[0].points;
  const winners = ranked.filter(r => r.points===best);
  $('finalKicker').textContent = winners.length>1 ? t('finalTie') : t('finalKicker');
  $('winnerName').textContent = winners.map(w=>w.name).join(' & ');
  ranked.forEach((r,idx) => { r.rank = ranked.findIndex(x => x.points===r.points) + 1; });

  const podium = $('podium'); podium.innerHTML='';
  const top = ranked.slice(0,3);
  const order = top.length===3 ? [1,0,2] : [1,0];
  order.forEach(k => {
    const r = top[k]; if(!r) return;
    const col = document.createElement('div'); col.className = 'pod r'+Math.min(r.rank,3);
    col.innerHTML = `<span class="token big" style="--c:${COLORS[r.i]}" aria-hidden="true">${AVATARS[r.i]}</span>
      <span class="nm">${esc(r.name)}</span><span class="pt">${esc(t('pts',{n:r.points}))}</span><div class="block">${r.rank}</div>`;
    podium.appendChild(col);
  });
  const rest = $('finalRest'); rest.innerHTML='';
  ranked.slice(3).forEach(r => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="rk">${r.rank}</span><span class="token" style="--c:${COLORS[r.i]}" aria-hidden="true">${AVATARS[r.i]}</span><span class="nm">${esc(r.name)}</span><span>${esc(t('pts',{n:r.points}))}</span>`;
    rest.appendChild(li);
  });
}
$('btnRestart').addEventListener('click', () => {
  state = freshState();
  renderPlayerSetup();
  showScreen('screen-players');
});

/* ============ ARRENCADA ============ */
makeSky();
buildCountButtons();
applyStatic();
renderPlayerSetup();
showScreen('screen-players');
</script>
